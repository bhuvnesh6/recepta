<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · {{ app_name }}</title>
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="{{ url_for('static', filename='images/logo-icon.png') }}" alt="Recepta">
        <span>Recepta</span>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in to your AI receptionist dashboard.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('auth.login_post') }}">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autofocus placeholder="you@business.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center; padding:11px;">Log in</button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a><br>
        <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
      </div>
    </div>
  </div>
</body>
</html>
