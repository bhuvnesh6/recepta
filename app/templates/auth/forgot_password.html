<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · {{ app_name }}</title>
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="{{ url_for('static', filename='images/logo-icon.png') }}" alt="Recepta">
        <span>Recepta</span>
      </div>
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for category, message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}
      {% endwith %}
      <form method="post" action="{{ url_for('auth.forgot_password_post') }}">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@business.com">
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center; padding:11px;">Send reset link</button>
      </form>
      <div class="auth-footer"><a href="{{ url_for('auth.login') }}">Back to log in</a></div>
    </div>
  </div>
</body>
</html>
