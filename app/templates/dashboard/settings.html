{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="page-header-row">
  <div>
    <h1 class="page-title">Settings</h1>
    <p class="page-subtitle">Manage your organization profile.</p>
  </div>
</div>

<div class="card" style="max-width: 520px;">
  <form method="post" action="{{ url_for('dashboard.settings_update') }}">
    <div class="field"><label>Organization name</label><input type="text" name="name" value="{{ org.name }}"></div>
    <div class="field"><label>Industry</label><input type="text" name="industry" value="{{ org.industry }}"></div>
    <div class="field"><label>Website</label><input type="url" name="website" value="{{ org.website }}"></div>
    <button class="btn btn-primary" type="submit">Save changes</button>
  </form>
</div>
{% endblock %}
